<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Instrument Sans";src:url(fonts/instrument-sans.woff2) format("woff2");font-weight:400 700}
body{margin:0;width:1080px;height:1920px;background:#F5F3EE;font-family:"Instrument Sans";color:#14201A;overflow:hidden}
#h{position:absolute;left:90px;top:640px;font-size:132px;font-weight:700;line-height:1.02;letter-spacing:-.04em}
.m{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}.m>span{display:inline-block}
.g{color:#0A8F5A}
#k{position:absolute;left:94px;top:560px;font:600 34px "Instrument Sans";letter-spacing:.06em;color:#5B6A62;text-transform:uppercase}
#e{position:absolute;left:90px;top:640px;font-size:150px;font-weight:700;letter-spacing:-.04em;line-height:1.02}
#u{position:absolute;left:94px;top:1040px;font:600 46px "Instrument Sans";color:#5B6A62}
</style></head><body><div id="k"></div><div id="h"></div><div id="e"></div><div id="u"></div><script>
const q=new URLSearchParams(location.search), mode=q.get('m')||'title';
const H=document.getElementById('h');
function words(el,t){el.innerHTML=t.split(' ').map(w=>{const g=w[0]=='^';return `<span class="m"><span class="${g?'g':''}">${g?w.slice(1):w}</span></span>`}).join(' ');return [...el.querySelectorAll('.m>span')]}
let W;
if(mode=='title'){document.getElementById('k').textContent='Bitcoin Cash';W=words(H,'Subscriptions you can ^actually ^cancel.')}
else{W=words(document.getElementById('e'),'Coins with ^rules.');document.getElementById('u').innerHTML='Get a wallet: bch.info'}
function spring(t){if(t<=0)return 0;const w=2*Math.PI*2.3,z=.86,wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+z/Math.sqrt(1-z*z)*Math.sin(wd*t))}
window.seek=t=>{W.forEach((w,i)=>{const p=spring(t-.05-i*.09);w.style.transform=`translateY(${(1-p)*110}%)`});
  const k=document.getElementById(mode=='title'?'k':'u');k.style.opacity=Math.min(1,Math.max(0,(t-(mode=='title'?0:.5))*3));};
seek(0);
</script></body></html>
